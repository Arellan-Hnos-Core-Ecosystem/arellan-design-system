name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (ui, eslint-config, typescript-config, all)'
        required: true
        default: 'ui'
        type: choice
        options:
          - ui
          - eslint-config
          - typescript-config
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arellan-hnos-core-ecosystem'

      - run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run test

      - run: pnpm run build

  publish-ui:
    name: Publish @arellan-hnos-core-ecosystem/ui
    needs: quality
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.package == 'ui' || github.event.inputs.package == 'all') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arellan-hnos-core-ecosystem'

      - run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm run build --filter=@arellan-hnos-core-ecosystem/ui

      - run: pnpm publish --filter=@arellan-hnos-core-ecosystem/ui --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-eslint-config:
    name: Publish @arellan-hnos-core-ecosystem/eslint-config
    needs: quality
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.package == 'eslint-config' || github.event.inputs.package == 'all') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arellan-hnos-core-ecosystem'

      - run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm publish --filter=@arellan-hnos-core-ecosystem/eslint-config --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-typescript-config:
    name: Publish @arellan-hnos-core-ecosystem/typescript-config
    needs: quality
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.package == 'typescript-config' || github.event.inputs.package == 'all') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arellan-hnos-core-ecosystem'

      - run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm publish --filter=@arellan-hnos-core-ecosystem/typescript-config --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
